name: PRDoc
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref }}

    - name: Install changelogger
      run: cargo install changelogger-cli --version 0.2.1

    - name: Generate PRDoc
      id: generate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PR_NUM=${{ github.event.pull_request.number }}
        PRDOC="prdoc/pr_${PR_NUM}.prdoc"
        if [ -f "$PRDOC" ]; then
          echo "PRDoc already exists at $PRDOC — validating only"
          echo "generated=false" >> "$GITHUB_OUTPUT"
        else
          changelogger prdoc generate --pr "$PR_NUM" --force --bump patch
          echo "generated=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate PRDoc
      env:
        CI: "true"
      run: |
        PRDOC="prdoc/pr_${{ github.event.pull_request.number }}.prdoc"
        changelogger prdoc validate "$PRDOC"

    - name: Commit PRDoc
      if: steps.generate.outputs.generated == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Add prdoc for PR #${{ github.event.pull_request.number }} (auto-generated)"
        branch: ${{ github.head_ref }}
        file_pattern: "prdoc/*.prdoc"